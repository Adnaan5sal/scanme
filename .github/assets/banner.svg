      <circle cx="18" cy="15" r="4" fill="#9ca3af"/>
      <text x="32" y="20">Live HTML report</text>
    </g>
  </g>

  <g transform="translate(870,80)">
    <rect width="340" height="240" rx="16" fill="#131a22" stroke="#232d38" stroke-width="1.5"/>
    <text x="24" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="12"
          fill="#9ca3af" letter-spacing="1">VULNSHOP — LIVE DEMO</text>

    <g transform="translate(24,58)" font-family="'Segoe UI', system-ui, sans-serif">
      <text x="0" y="46" font-size="46" font-weight="800" fill="#ea580c">D</text>
