    <path d="M42 82 L54 96 L82 60" fill="none" stroke="#16a34a" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="220" y="150" font-family="'Segoe UI', system-ui, sans-serif" font-size="72"
