    </g>
    <g transform="translate(384,220)">
      <rect width="130" height="30" rx="15" fill="#131a22" stroke="#232d38"/>
      <circle cx="18" cy="15" r="4" fill="#2563eb"/>
      <text x="32" y="20">Multi-agent</text>
    </g>
    <g transform="translate(526,220)">
      <rect width="180" height="30" rx="15" fill="#131a22" stroke="#232d38"/>
      <circle cx="18" cy="15" r="4" fill="#d97706"/>
