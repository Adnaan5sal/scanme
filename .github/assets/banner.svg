<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0f1620"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="180" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="120" cy="360" r="140" fill="#2563eb" opacity="0.10" filter="url(#soft)"/>

  <g stroke="#1a2129" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
  </g>

  <g transform="translate(70,120)">
    <path d="M60 0 L114 22 V70 C114 118 88 150 60 164 C32 150 6 118 6 70 V22 Z"
